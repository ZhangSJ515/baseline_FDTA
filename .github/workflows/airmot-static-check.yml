name: AirMOT and UA-DETRAC static checks

on:
  push:
    branches:
      - feature/airmot-support
      - feature/airmot-uadetrac-support
  pull_request:
    paths:
      - 'data/airmot.py'
      - 'data/uadetrac.py'
      - 'data/joint_dataset.py'
      - 'models/airmot_runtime_tracker.py'
      - 'submit_and_evaluate_airmot.py'
      - 'submit_and_evaluate_uadetrac.py'
      - 'TrackEval/**'
      - 'tools/**airmot**'
      - 'tools/**uadetrac**'
      - 'tools/gen_depthmaps.py'
      - 'scripts/**airmot**'
      - 'scripts/**uadetrac**'
      - 'configs/airmot.yaml'
      - 'configs/uadetrac.yaml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile adapted Python sources
        run: |
          python -m py_compile \
            data/airmot.py \
            data/uadetrac.py \
            data/joint_dataset.py \
            models/airmot_runtime_tracker.py \
            submit_and_evaluate_airmot.py \
            submit_and_evaluate_uadetrac.py \
            TrackEval/scripts/run_airmot.py \
            TrackEval/scripts/run_uadetrac.py \
            TrackEval/trackeval/datasets/airmot.py \
            TrackEval/trackeval/datasets/uadetrac.py \
            tools/check_airmot_setup.py \
            tools/check_uadetrac_setup.py \
            tools/convert_airmot_detr_pretrain.py \
            tools/convert_uadetrac_detr_pretrain.py \
            tools/gen_depthmaps.py \
            tools/smoke_test_airmot.py \
            tools/smoke_test_uadetrac.py
      - name: Validate shell syntax
        run: |
          for script in scripts/*airmot*.sh scripts/*uadetrac*.sh; do
            bash -n "${script}"
          done
